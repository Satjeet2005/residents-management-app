<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf8f1">
<title>Township: you're offline</title>
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<style>
  /* Self-contained on purpose: the service worker keeps only this file and the icons, so it cannot rely on the app's stylesheet or fonts. Values are the design tokens. */
  :root { --paper: #fbf8f1; --ink: #1c1a17; --ink-2: #57514a; --accent: #0e4f47; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 48rem; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 16px 0 0; }
  p { margin: 0; }
  .rule { border: 0; border-top: 4px double var(--ink); margin: 0; }
  a.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border: 2px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>You're offline.</h1>
  <hr class="rule">
  <p>You can't pay right now.</p>
  <a class="button" href="/">Try again</a>
</main>
</body>
</html>
