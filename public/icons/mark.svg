    <rect x="128" y="132" width="256" height="24"/>
    <rect x="128" y="168" width="256" height="8"/>
    <rect x="212" y="212" width="88" height="88"/>
    <rect x="128" y="336" width="256" height="8"/>
    <rect x="128" y="356" width="256" height="24"/>
  </g>
</svg>
