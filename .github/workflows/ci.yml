name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: township
          POSTGRES_PASSWORD: township_local_only
          POSTGRES_DB: township
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U township -d township"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://township:township_local_only@localhost:5432/township
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:integration
      - run: npm run scan:secrets
      - name: gitleaks (full history, pinned CLI)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${tmp}/${archive}" "${base}/${archive}"
          curl -fsSL --retry 3 -o "${tmp}/${checksums}" "${base}/${checksums}"
          (cd "${tmp}" && grep " ${archive}$" "${checksums}" | sha256sum -c -)
          tar -xzf "${tmp}/${archive}" -C "${tmp}" gitleaks
          "${tmp}/gitleaks" git --redact --exit-code 1 --no-banner --verbose .
