services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: township
      POSTGRES_PASSWORD: township_local_only
      POSTGRES_DB: township
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U township -d township"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
